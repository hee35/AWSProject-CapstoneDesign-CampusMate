<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/style.css">
  <title>회원가입</title>
</head>
<body>
  <div>
    <h1>회원가입</h1>
    <form method="post" action="/register">
      <!-- 사용자 아이디 입력창 (필수 입력) -->
      아이디(필수): <input type="text" name="username" required><br>
      <!-- 사용자 비밀번호 입력창 (필수 입력) -->
      비밀번호(필수): <input type="password" name="password" required><br>
      <!-- 사용자 닉네임 입력창 (필수 입력) -->
      닉네임(필수): <input type="text" name="nickname" required><br>
      <!-- 폼 제출 버튼: 입력된 값들을 /register로 전송 -->
      <br>
      <button type="submit">가입하기</button>
    </form>
    <br>
    <!-- 로그인 페이지로 이동하는 버튼: GET 방식으로 /login 이동 -->
    <form action="/login" method="get">
      <button type="submit">로그인으로 돌아가기</button>
    </form>
  </div>
</body>
</html>
